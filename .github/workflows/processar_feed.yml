# Atualização automática do feed
name: Processar Feed XML

on:
  schedule:
    # A cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script.py
        run: |
          python script.py || { echo "Erro ao executar script.py"; exit 1; }

      - name: Executar merge_json.py
        run: |
          python merge_json.py || { echo "Erro ao executar merge_json.py"; exit 1; }

      - name: Verificar arquivos gerados
        run: |
          echo "📁 json_parts:"
          ls -lh json_parts/
          echo "📄 merged.json:"
          ls -lh merged.json || true
          echo "📄 estado diário:"
          ls -lh daily_jobs_state.json || true

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Commit e Push
        run: |
          git add -f json_parts/
          git add -f merged.json
          git add -f daily_jobs_state.json
          git commit -m "Atualização do feed - até 1000 vagas por execução" || echo "Nada para commitar"
          git push || echo "Nenhuma alteração para enviar"
